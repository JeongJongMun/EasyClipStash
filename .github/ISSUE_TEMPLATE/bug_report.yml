name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Feel free to write in English or Korean. / 한국어로 작성해도 됩니다.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: App version (hover the tray icon) and your Windows version.
      placeholder: EasyClipStash 1.3.2, Windows 11
    validations:
      required: true
